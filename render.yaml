services:
  - type: web
    name: cs2-arena-api
    runtime: python
    plan: 0.5c-512mb
    repo: https://github.com/bissembayevd/React
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    disk:
      name: cs2-arena-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        value: sqlite:////var/data/arena.db
      - key: CORS_ORIGINS
        value: https://bissembayevd.github.io
